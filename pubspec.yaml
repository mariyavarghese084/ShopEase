name: shopease
description: "ShopEase - Your style, your way. A professional fashion e-commerce app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  shared_preferences: ^2.3.2
  flutter_launcher_icons: ^0.14.4
  firebase_storage: ^14.0.1
  image_picker: ^1.2.4
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^18.0.1
  firebase_in_app_messaging: ^0.10.1
  firebase_analytics: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - Assest/
    - Assest/1101693127585736227.jpeg
    - Assest/1125759238142635105.jpeg
    - Assest/454863631129179235.jpeg
    - Assest/614037730488778069.jpeg
    - Assest/Beachy Blush in a Flash.jpeg
    - Assest/Dreamy lipstick vibes 🌸 AI commercial photography for beauty brands.jpeg
    - Assest/Psd cosmetics beauty products and makeup social media post and discount sale banner design template _ Premium PSD.jpeg
    - Assest/RAL Rare Beauty.jpeg
    - Assest/The Viral Blush Beauty Lovers Are Obsessed With.jpeg
    - Assest/「インテリアグリーン」をセンスよく飾る7つのアイデア.jpeg
    - Assest/LunchIcon.jpg
    
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "Assest/LunchIcon.jpg"
  min_sdk_android: 21